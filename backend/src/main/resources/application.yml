server:
  port: 8080

spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/chatdb?TimeZone=UTC
    username: admin
    password: secret
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  data:
    redis:
      host: localhost
      port: 6379
  servlet:
    multipart:
      enabled: true
      max-file-size: 20MB
      max-request-size: 22MB

